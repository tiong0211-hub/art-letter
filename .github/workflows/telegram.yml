name: Notify Telegram
on:
  push:
    branches: [main]
    paths: [publication.json]
  workflow_dispatch:   # Actions 탭 > Notify Telegram > Run workflow: 최신 레터를 다시 보냄(테스트용)
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/publish.py verify
      - name: Send new issues
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 tools/notify_telegram.py --latest
          else
            python3 tools/notify_telegram.py ${{ github.event.before }}
          fi
