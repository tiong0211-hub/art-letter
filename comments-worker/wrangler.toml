name = "art-letter-comments"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# 댓글을 허용할 사이트 주소(쉼표로 여러 개 가능). 스킴+호스트만, 경로 없이.
ALLOWED_ORIGINS = "https://tiong0211-hub.github.io"
# 발행된 레터 목록. 여기 있는 레터 ID에만 댓글을 받습니다. 비우면 ID 형식만 검사합니다.
PUBLICATION_URL = "https://tiong0211-hub.github.io/art-letter/publication.json"

# `wrangler d1 create art-letter-comments` 실행 후 나온 database_id로 바꿉니다.
[[d1_databases]]
binding = "DB"
database_name = "art-letter-comments"
database_id = "REPLACE_WITH_DATABASE_ID"

# 비밀값(코드에 넣지 않음):
#   npx wrangler secret put ADMIN_TOKEN   # 관리자 삭제용, 임의의 긴 문자열
#   npx wrangler secret put IP_SALT       # IP 해시용 소금값, 임의의 긴 문자열
